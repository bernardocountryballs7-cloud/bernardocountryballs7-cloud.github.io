<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberLock | Gerador de Senhas Seguras</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #121214;
            color: #ffffff;
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
        }

        header {
            border-left: 3px solid #00e5ff;
            padding-left: 16px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            color: #ffffff;
            line-height: 1.3;
        }

        h1::first-letter {
            color: #00e5ff;
        }

        .subtitle {
            margin-top: 12px;
            color: #a7a7ad;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .terminal {
            background: #18181b;
            border: 1px solid #303036;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.05);
        }

        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 20px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #45454b;
        }

        .terminal-label {
            margin-left: 8px;
            color: #66666d;
            font-size: 0.75rem;
        }

        .password-box {
            min-height: 100px;
            width: 100%;
            background: #0d0d0f;
            border: 1px solid #34343a;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow-wrap: anywhere;
            transition: 0.2s ease;
        }

        .password-box.active {
            border-color: #00e5ff;
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.12);
        }

        #password {
            font-size: clamp(1.1rem, 4vw, 1.7rem);
            color: #00e5ff;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            transition: 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .generate-btn {
            flex: 1;
            background: #00e5ff;
            color: #061014;
            padding: 15px 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .generate-btn:hover {
            background: #62efff;
            transform: translateY(-1px);
        }

        .generate-btn:active,
        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-btn {
            background: #242428;
            color: #ffffff;
            border: 1px solid #3b3b41;
            padding: 15px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .copy-btn:hover {
            border-color: #00e5ff;
            color: #00e5ff;
        }

        .status {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
            color: #00e5ff;
            font-size: 0.8rem;
        }

        .info {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #29292e;
            color: #707077;
            font-size: 0.75rem;
            line-height: 1.6;
            text-align: center;
        }

        @media (max-width: 520px) {
            body {
                padding: 14px;
            }

            .terminal {
                padding: 18px;
            }

            .actions {
                flex-direction: column;
            }

            .copy-btn,
            .generate-btn {
                width: 100%;
            }

            .password-box {
                min-height: 90px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header>
            <h1>🔐 CyberLock | Gerador de Senhas Seguras</h1>

            <p class="subtitle">
                Proteja suas contas de jogos e redes sociais criando senhas
                impossíveis de serem hackeadas.
            </p>
        </header>

        <section class="terminal">

            <div class="terminal-bar">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="terminal-label">CYBERLOCK_TERMINAL</span>
            </div>

            <div class="password-box" id="passwordBox">
                <span id="password">
                    Clique no botão para gerar...
                </span>
            </div>

            <div class="actions">

                <button
                    class="generate-btn"
                    id="generateBtn">
                    ⚡ GERAR SENHA FORTE
                </button>

                <button
                    class="copy-btn"
                    id="copyBtn">
                    📋 Copiar
                </button>

            </div>

            <div class="status" id="status"></div>

            <div class="info">
                14 caracteres • Maiúsculas • Minúsculas • Números • Símbolos
            </div>

        </section>

    </main>

    <script>
        "use strict";

        const passwordElement = document.getElementById("password");
        const passwordBox = document.getElementById("passwordBox");
        const generateButton = document.getElementById("generateBtn");
        const copyButton = document.getElementById("copyBtn");
        const statusElement = document.getElementById("status");

        const UPPERCASE = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const LOWERCASE = "abcdefghijklmnopqrstuvwxyz";
        const NUMBERS = "0123456789";
        const SYMBOLS = "@#$%!&*";

        const ALL_CHARACTERS =
            UPPERCASE +
            LOWERCASE +
            NUMBERS +
            SYMBOLS;

        const PASSWORD_LENGTH = 14;


        // Escolhe um caractere usando o gerador
        // criptograficamente seguro do navegador.
        function secureRandomIndex(max) {
            const randomArray = new Uint32Array(1);

            crypto.getRandomValues(randomArray);

            return randomArray[0] % max;
        }


        function randomCharacter(characters) {
            return characters[
                secureRandomIndex(characters.length)
            ];
        }


        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {

                const j = secureRandomIndex(i + 1);

                [array[i], array[j]] =
                    [array[j], array[i]];
            }

            return array;
        }


        function generatePassword() {

            const passwordCharacters = [

                randomCharacter(UPPERCASE),
                randomCharacter(LOWERCASE),
                randomCharacter(NUMBERS),
                randomCharacter(SYMBOLS)

            ];


            while (
                passwordCharacters.length <
                PASSWORD_LENGTH
            ) {

                passwordCharacters.push(
                    randomCharacter(ALL_CHARACTERS)
                );

            }


            shuffle(passwordCharacters);


            const password =
                passwordCharacters.join("");


            passwordElement.textContent = password;

            passwordBox.classList.add("active");

            statusElement.textContent =
                "Senha forte gerada com sucesso!";


            setTimeout(() => {
                statusElement.textContent = "";
            }, 1800);
        }


        async function copyPassword() {

            const password =
                passwordElement.textContent;


            if (
                !password ||
                password === "Clique no botão para gerar..."
            ) {

                statusElement.textContent =
                    "Gere uma senha primeiro.";

                return;
            }


            try {

                await navigator.clipboard.writeText(password);

                statusElement.textContent =
                    "Senha copiada com sucesso!";

            } catch (error) {

                // Fallback para navegadores que não
                // disponibilizam a Clipboard API.
                const textArea =
                    document.createElement("textarea");

                textArea.value = password;

                textArea.style.position = "fixed";
                textArea.style.opacity = "0";

                document.body.appendChild(textArea);

                textArea.select();

                try {

                    document.execCommand("copy");

                    statusElement.textContent =
                        "Senha copiada com sucesso!";

                } catch {

                    statusElement.textContent =
                        "Não foi possível copiar automaticamente.";

                }

                document.body.removeChild(textArea);
            }


            setTimeout(() => {
                statusElement.textContent = "";
            }, 1800);
        }


        generateButton.addEventListener(
            "click",
            generatePassword
        );


        copyButton.addEventListener(
            "click",
            copyPassword
        );

    </script>

</body>
</html>
